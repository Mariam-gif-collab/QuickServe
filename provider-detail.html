<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickServe | Service Provider</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar"><a href="index.html" class="brand-logo">Quick<span>Serve</span></a></nav>

  <div class="container" style="max-width: 700px;">
    <div id="provider-info" style="margin-bottom: 2rem;"></div>

    <form id="booking-form" style="background: var(--surface); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border);">
      <h3>Book Service</h3>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="booking-category" class="form-control" placeholder="e.g. Plumbing" required>
      </div>
      <div class="form-group"><label>Date</label><input type="date" id="booking-date" class="form-control" required></div>
      <div class="form-group"><label>Time</label><input type="time" id="booking-time" class="form-control" required></div>
      <div class="form-group"><label>Location</label><input type="text" id="booking-location" class="form-control" required></div>
      <div class="form-group"><label>Description</label><textarea id="booking-desc" class="form-control" required></textarea></div>
      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Submit Request</button>
    </form>
  </div>

  <script type="module" src="js/booking.js"></script>
</body>
</html>
